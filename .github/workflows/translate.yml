name: translate-maqayis
on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: translate
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/translate.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIME_CAP_MIN: "40"
      - if: always()
        run: |
          git config user.name "nibras-bot"; git config user.email "bot@nibrascode.com"
          git add -A out state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "maqayis: $(jq .next state.json)/$(jq .total state.json)" && git push)
